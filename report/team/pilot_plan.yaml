# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (n = co_mau(0.70, 0.75))
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 3.103 mỗi nhóm -> 42 người/nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: giới hạn c / ICC = 20 / 0,02 = 1.000 < 1.251 -> không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: giới hạn c / ICC = 6 / 0,02 = 300 < 1.251 -> không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, tất cả được chốt trước ngày bắt đầu trong file này.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận mức chênh tối thiểu phát hiện được (MDE) 6 điểm (0,70 -> 0,76) với n_per_arm = 859, m >= 299 yêu cầu/nhân viên. Nếu tác động thật chỉ đạt 5 điểm, power giảm còn ~0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại: 4,25% toàn bộ (51/1.200), 3,97% trong phạm vi noi_dia + hang_nang (39/982). Ngưỡng an toàn chọn: cao hơn đối chứng >= 2 điểm hoặc trần tuyệt đối > 6% trong 3 ngày liên tiếp (tránh ngưỡng 3% làm dừng ngay tuần đầu).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22×, simulated) và hang_nang (0,69×, simulated) tại 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
