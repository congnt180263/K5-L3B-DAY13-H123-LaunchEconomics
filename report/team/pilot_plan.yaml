    spillover_risk: "Nhân viên cùng depot có thể trao đổi câu trả lời; giảm bằng phân quyền tài khoản riêng và log staff_id"
    predeclared: "Chỉ số chính, ngưỡng dừng, cỡ mẫu và ngày quyết định chốt trước khi chạy pilot"
